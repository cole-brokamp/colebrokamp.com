[package]
name = "colebrokamp-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
indexmap = { version = "2", features = ["serde"] }
minijinja = "2.21.0"
noyalib = "0.0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
