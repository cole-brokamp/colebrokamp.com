- name: "geomarker"
  description: "An R package for linking environmental exposures and community characteristics with people according to their locations and dates."
  project_url: "https://geomarker-io.r-universe.dev/geomarker"
  github_url: "https://github.com/geomarker-io/geomarker"
- name: "addr"
  description: "An R package and container for cleaning, matching, and geocoding messy U.S. addresses."
  project_url: "https://geomarker.io/addr/"
  github_url: "https://github.com/geomarker-io/addr"
- name: "appc"
  description: "An R package for estimating daily, high-resolution ambient air pollution across the contiguous United States."
  project_url: "https://geomarker.io/appc/"
  github_url: "https://github.com/geomarker-io/appc"
- name: "CoDEC"
  description: "An R package and web explorer for finding, harmonizing, and using community data for Cincinnati."
  project_url: "https://geomarker.io/codec/"
  github_url: "https://github.com/geomarker-io/codec"
- name: "PurpleAir"
  description: "An R package for retrieving real-time and historical air-quality data from the PurpleAir API."
  project_url: "https://cran.r-project.org/web/packages/PurpleAir/index.html"
  github_url: "https://github.com/cole-brokamp/PurpleAir"
- name: "stow"
  description: "An R package for turning remote file URLs into durable managed local copies that can be reused across R sessions and offline."
  project_url: "https://cran.r-project.org/web/packages/stow/index.html"
  github_url: "https://github.com/cole-brokamp/stow"
