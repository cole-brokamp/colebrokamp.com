<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500"
     role="img"
     aria-labelledby="neighborhood-title neighborhood-description">
  <title id="neighborhood-title">A random forest as an adaptive neighborhood</title>
  <desc id="neighborhood-description">
    Three trees partition the same training observations in different ways.
    In each tree, observations sharing a terminal leaf with the target point
    receive weight. The lower panel combines those memberships, drawing
    observations larger when they share the target leaf in more trees.
  </desc>

  <defs>
    <marker id="arrowhead"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#58829C" />
    </marker>
  </defs>

  <style>
    .plot {
      fill: #F6EDDE;
      stroke: #396175;
      stroke-width: 2.5;
    }

    .target-leaf {
      fill: #CBD6D5;
      opacity: 0.55;
    }

    .partition,
    .combine-line {
      fill: none;
      stroke: #58829C;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .partition {
      stroke-width: 2.25;
    }

    .combine-line {
      stroke-width: 3;
    }

    .outside-leaf {
      fill: #8CB4C3;
      opacity: 0.72;
    }

    .inside-leaf {
      fill: #396175;
    }

    .weight-zero {
      fill: #CBD6D5;
    }

    .weight-one {
      fill: #8CB4C3;
    }

    .weight-two {
      fill: #58829C;
    }

    .weight-three {
      fill: #396175;
    }

    .target {
      fill: none;
      stroke: #396175;
      stroke-linecap: round;
      stroke-width: 3.5;
    }
  </style>

  <g aria-hidden="true">
    <!-- Tree partition 1. -->
    <g transform="translate(30 20)">
      <rect class="plot" x="0" y="0" width="220" height="180" rx="8" />
      <path class="target-leaf" d="M 75 0 H 165 V 105 H 75 Z" />
      <path class="partition" d="M 75 0 V 120 M 0 120 H 220 M 75 105 H 220 M 165 0 V 105" />

      <circle class="outside-leaf" cx="25" cy="30" r="2.5" />
      <circle class="outside-leaf" cx="55" cy="50" r="2.5" />
      <circle class="inside-leaf" cx="85" cy="25" r="5" />
      <circle class="inside-leaf" cx="120" cy="40" r="5" />
      <circle class="inside-leaf" cx="160" cy="25" r="5" />
      <circle class="outside-leaf" cx="190" cy="55" r="2.5" />
      <circle class="outside-leaf" cx="35" cy="80" r="2.5" />
      <circle class="outside-leaf" cx="70" cy="95" r="2.5" />
      <circle class="inside-leaf" cx="100" cy="75" r="5" />
      <circle class="inside-leaf" cx="135" cy="70" r="5" />
      <circle class="outside-leaf" cx="180" cy="90" r="2.5" />
      <circle class="outside-leaf" cx="25" cy="130" r="2.5" />
      <circle class="outside-leaf" cx="60" cy="150" r="2.5" />
      <circle class="outside-leaf" cx="95" cy="135" r="2.5" />
      <circle class="outside-leaf" cx="125" cy="155" r="2.5" />
      <circle class="outside-leaf" cx="165" cy="140" r="2.5" />
      <circle class="outside-leaf" cx="195" cy="150" r="2.5" />

      <path class="target" d="M 102 82 L 118 98 M 118 82 L 102 98" />
    </g>

    <!-- Tree partition 2. -->
    <g transform="translate(290 20)">
      <rect class="plot" x="0" y="0" width="220" height="180" rx="8" />
      <path class="target-leaf" d="M 0 0 H 150 V 110 H 0 Z" />
      <path class="partition" d="M 150 0 V 180 M 0 110 H 150" />

      <circle class="inside-leaf" cx="25" cy="30" r="5" />
      <circle class="inside-leaf" cx="55" cy="50" r="5" />
      <circle class="inside-leaf" cx="85" cy="25" r="5" />
      <circle class="inside-leaf" cx="120" cy="40" r="5" />
      <circle class="outside-leaf" cx="160" cy="25" r="2.5" />
      <circle class="outside-leaf" cx="190" cy="55" r="2.5" />
      <circle class="inside-leaf" cx="35" cy="80" r="5" />
      <circle class="inside-leaf" cx="70" cy="95" r="5" />
      <circle class="inside-leaf" cx="100" cy="75" r="5" />
      <circle class="inside-leaf" cx="135" cy="70" r="5" />
      <circle class="outside-leaf" cx="180" cy="90" r="2.5" />
      <circle class="outside-leaf" cx="25" cy="130" r="2.5" />
      <circle class="outside-leaf" cx="60" cy="150" r="2.5" />
      <circle class="outside-leaf" cx="95" cy="135" r="2.5" />
      <circle class="outside-leaf" cx="125" cy="155" r="2.5" />
      <circle class="outside-leaf" cx="165" cy="140" r="2.5" />
      <circle class="outside-leaf" cx="195" cy="150" r="2.5" />

      <path class="target" d="M 102 82 L 118 98 M 118 82 L 102 98" />
    </g>

    <!-- Tree partition 3. -->
    <g transform="translate(550 20)">
      <rect class="plot" x="0" y="0" width="220" height="180" rx="8" />
      <path class="target-leaf" d="M 50 0 H 155 V 120 H 50 Z" />
      <path class="partition" d="M 50 0 V 120 M 155 0 V 120 M 0 120 H 220" />

      <circle class="outside-leaf" cx="25" cy="30" r="2.5" />
      <circle class="inside-leaf" cx="55" cy="50" r="5" />
      <circle class="inside-leaf" cx="85" cy="25" r="5" />
      <circle class="inside-leaf" cx="120" cy="40" r="5" />
      <circle class="outside-leaf" cx="160" cy="25" r="2.5" />
      <circle class="outside-leaf" cx="190" cy="55" r="2.5" />
      <circle class="outside-leaf" cx="35" cy="80" r="2.5" />
      <circle class="inside-leaf" cx="70" cy="95" r="5" />
      <circle class="inside-leaf" cx="100" cy="75" r="5" />
      <circle class="inside-leaf" cx="135" cy="70" r="5" />
      <circle class="outside-leaf" cx="180" cy="90" r="2.5" />
      <circle class="outside-leaf" cx="25" cy="130" r="2.5" />
      <circle class="outside-leaf" cx="60" cy="150" r="2.5" />
      <circle class="outside-leaf" cx="95" cy="135" r="2.5" />
      <circle class="outside-leaf" cx="125" cy="155" r="2.5" />
      <circle class="outside-leaf" cx="165" cy="140" r="2.5" />
      <circle class="outside-leaf" cx="195" cy="150" r="2.5" />

      <path class="target" d="M 102 82 L 118 98 M 118 82 L 102 98" />
    </g>

    <!-- Combine co-occurrence across trees into adaptive forest weights. -->
    <path class="combine-line" d="M 140 200 V 235 H 660 M 400 200 V 235 M 660 200 V 235" />
    <path class="combine-line" d="M 400 235 V 282" marker-end="url(#arrowhead)" />

    <rect class="plot" x="290" y="300" width="220" height="180" rx="8" />
    <g transform="translate(290 300)">
      <circle class="weight-one" cx="25" cy="30" r="3.5" />
      <circle class="weight-two" cx="55" cy="50" r="5.2" />
      <circle class="weight-three" cx="85" cy="25" r="7" />
      <circle class="weight-three" cx="120" cy="40" r="7" />
      <circle class="weight-one" cx="160" cy="25" r="3.5" />
      <circle class="weight-zero" cx="190" cy="55" r="2.4" />
      <circle class="weight-one" cx="35" cy="80" r="3.5" />
      <circle class="weight-two" cx="70" cy="95" r="5.2" />
      <circle class="weight-three" cx="100" cy="75" r="7" />
      <circle class="weight-three" cx="135" cy="70" r="7" />
      <circle class="weight-zero" cx="180" cy="90" r="2.4" />
      <circle class="weight-zero" cx="25" cy="130" r="2.4" />
      <circle class="weight-zero" cx="60" cy="150" r="2.4" />
      <circle class="weight-zero" cx="95" cy="135" r="2.4" />
      <circle class="weight-zero" cx="125" cy="155" r="2.4" />
      <circle class="weight-zero" cx="165" cy="140" r="2.4" />
      <circle class="weight-zero" cx="195" cy="150" r="2.4" />

      <path class="target" d="M 102 82 L 118 98 M 118 82 L 102 98" />
    </g>
  </g>
</svg>
